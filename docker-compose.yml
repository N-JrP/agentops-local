services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentops-local-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentops}:${POSTGRES_PASSWORD:-agentops-local-dev}@postgres:5432/${POSTGRES_DB:-agentops}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      PUBLIC_STATUS_NAME: ${PUBLIC_STATUS_NAME:-GitHub Status API}
      PUBLIC_STATUS_BASE_URL: ${PUBLIC_STATUS_BASE_URL:-https://www.githubstatus.com/api/v2}
      EXTERNAL_HTTP_TIMEOUT_SECONDS: ${EXTERNAL_HTTP_TIMEOUT_SECONDS:-15}
      TOOL_MAX_ATTEMPTS: ${TOOL_MAX_ATTEMPTS:-2}
      TOOL_RETRY_BACKOFF_SECONDS: ${TOOL_RETRY_BACKOFF_SECONDS:-0.25}
      PLANNER_PROMPT_VERSION: ${PLANNER_PROMPT_VERSION:-planner-live-v3}
      ANSWER_PROMPT_VERSION: ${ANSWER_PROMPT_VERSION:-answer-grounded-v3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["mcp"]
    command: ["python", "-m", "backend.mcp_server"]
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      PUBLIC_STATUS_NAME: ${PUBLIC_STATUS_NAME:-GitHub Status API}
      PUBLIC_STATUS_BASE_URL: ${PUBLIC_STATUS_BASE_URL:-https://www.githubstatus.com/api/v2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-agentops-local-dev}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data:
  grafana_data:
