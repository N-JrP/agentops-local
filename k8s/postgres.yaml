apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: agentops
type: Opaque
stringData:
  POSTGRES_PASSWORD: agentops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: agentops
            - name: POSTGRES_USER
              value: agentops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentops
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
