apiVersion: v1
kind: ConfigMap
metadata:
  name: agentops-config
  namespace: agentops
data:
  OLLAMA_HOST: http://host.docker.internal:11434
  OLLAMA_MODEL: qwen2.5-coder:7b
  PUBLIC_STATUS_NAME: GitHub Status API
  PUBLIC_STATUS_BASE_URL: https://www.githubstatus.com/api/v2
  EXTERNAL_HTTP_TIMEOUT_SECONDS: "15"
  TOOL_MAX_ATTEMPTS: "2"
  TOOL_RETRY_BACKOFF_SECONDS: "0.25"
  PLANNER_PROMPT_VERSION: planner-live-v3
  ANSWER_PROMPT_VERSION: answer-grounded-v3
