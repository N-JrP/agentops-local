apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-ui
  namespace: agentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-ui
  template:
    metadata:
      labels:
        app: agentops-ui
    spec:
      containers:
        - name: ui
          image: agentops-local-ui:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: API_URL
              value: http://agentops-backend:8000
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-ui
  namespace: agentops
spec:
  type: NodePort
  selector:
    app: agentops-ui
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30501
